<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil — PolitiCast</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="nav"><div class="wrap"><a class="brand" href="app.html">Politi<b>Cast</b></a></div></header>
<main class="wrap sec">
  <p id="load" class="muted">Yuklanmoqda...</p>
  <div id="main" hidden>
    <h1>Profil</h1>
    <p class="muted">Ism va familiya reytingda ko'rinadi.</p>
    <form class="form" id="f" style="margin-top:18px">
      <label for="fn">Ism</label><input id="fn" maxlength="40" autocomplete="given-name" required>
      <label for="ln">Familiya</label><input id="ln" maxlength="40" autocomplete="family-name" required>
      <label for="em">Elektron pochta (Google akkauntingizdan)</label><input id="em" readonly>
      <button class="btn" id="save" type="submit">Saqlash</button>
    </form>
    <div class="msg" id="msg" hidden></div>
  </div>
</main>
<script type="module" src="profil.js"></script>
</body>
</html>
